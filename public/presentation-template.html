*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
html{font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
:root{
  --wine:#4A1B2C; --wine-deep:#2A0E1A; --rose:#8E3B52; --rose-l:#C77C8A;
  --blush:#F5E8E5; --cream:#FFF8F5; --gold:#F7D98B; --gold-d:#D6A84F;
  --ink:#3B3032; --green:#72A68A; --red:#C95C62; --muted:#B99FA0;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,-apple-system,sans-serif;
}
body{background:#10060B;font-family:var(--sans);color:var(--cream);overflow:hidden;-webkit-font-smoothing:antialiased}
#stage{position:fixed;inset:0;display:grid;place-items:center}
#deck{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.slide{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;padding:92px 120px 0;display:flex;flex-direction:column;
  opacity:0;visibility:hidden;transform:scale(.988);transition:opacity .5s ease,transform .7s cubic-bezier(.2,.8,.2,1)}
.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}
.slide>*{position:relative;z-index:1}
.content{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:72px;min-height:0}
.slide.dark{background:
  radial-gradient(1200px 820px at 80% 6%,rgba(199,124,138,.28),transparent 62%),
  radial-gradient(900px 700px at 6% 96%,rgba(247,217,139,.10),transparent 60%),
  linear-gradient(150deg,#411725 0%,#2A0E1A 52%,#1B0810 100%)}
.slide.dark::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.05'/></svg>")}
.slide.light{background:linear-gradient(155deg,#FFF8F5 0%,#FCF0EC 55%,#F6E4E0 100%);color:var(--ink)}
.slide.light::before{content:"";position:absolute;right:-260px;top:-300px;width:900px;height:900px;border-radius:50%;
  background:radial-gradient(circle,rgba(199,124,138,.16),transparent 65%);pointer-events:none}
a{color:inherit}

/* ---------- type ---------- */
.eyebrow{font-size:19px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:16px}
.eyebrow::before{content:"";width:44px;height:1px;background:var(--gold);display:inline-block;opacity:.8}
.light .eyebrow{color:#A0455F}
.light .eyebrow::before{background:#A0455F}
h1.display{font-family:var(--serif);font-weight:600;font-size:132px;line-height:.94;letter-spacing:-.02em;margin:34px 0 0}
.title{font-family:var(--serif);font-weight:600;font-size:86px;line-height:1.02;letter-spacing:-.015em;margin:22px 0 46px;color:var(--cream)}
.light .title{color:var(--ink)}
.ital{font-style:italic;color:var(--gold)}
.light .ital.accent{color:var(--rose)}
.lead{font-size:31px;line-height:1.5;color:rgba(255,248,245,.74);margin:0;font-weight:400}
.lead b{color:var(--cream);font-weight:500}
.dark-lead{color:rgba(59,48,50,.76)}
.dark-lead b{color:var(--ink)}
code{font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:.92em;background:rgba(142,59,82,.12);padding:2px 8px;border-radius:7px;color:#8E3B52}
.dark code{background:rgba(255,248,245,.1);color:var(--gold)}
.ic{width:32px;height:32px;stroke-width:1.6;flex:none}

/* ---------- chrome ---------- */
.foot{position:absolute!important;left:120px;right:120px;bottom:44px;display:flex;justify-content:space-between;align-items:center;
  font-size:16px;letter-spacing:.16em;color:rgba(255,248,245,.42);text-transform:uppercase;z-index:2}
.foot-l{display:flex;align-items:center;gap:14px}
.foot .dot{width:7px;height:7px;border-radius:50%;background:var(--gold);display:inline-block}
.foot-r{color:rgba(255,248,245,.6);letter-spacing:.08em}
.foot-r span{color:rgba(255,248,245,.32)}
.light .foot{color:rgba(59,48,50,.42)}
.light .foot-r{color:rgba(59,48,50,.62)}
.light .foot-r span{color:rgba(59,48,50,.3)}
.light .foot .dot{background:var(--rose)}

/* ---------- anim ---------- */
.slide.active .anim{animation:rise .85s cubic-bezier(.16,.84,.24,1) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.slide.active .anim{animation:none}.slide.active .chart .bar{animation:none!important;transform:none!important}.slide.active .chart .cv{animation:none!important;opacity:1!important}.branch-svg .draw{stroke-dashoffset:0!important;animation:none!important}.branch-svg .pop{animation:none!important;opacity:1!important}.slide.active .sw-chip,.slide.active .tbar-track i{animation:none!important;transform:none!important}}

/* ---------- v4.1 reveals ---------- */
.chart .bar{transform-box:fill-box;transform-origin:50% 100%}
.slide.active .chart .bar{animation:barIn .75s cubic-bezier(.2,.8,.25,1) both;animation-delay:var(--d,0s)}
@keyframes barIn{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.slide.active .chart .cv{animation:cvIn .5s ease both;animation-delay:var(--cd,0s)}
@keyframes cvIn{from{opacity:0}to{opacity:1}}
.branch-svg .draw{stroke-dashoffset:100}
.slide.active .branch-svg .draw{stroke-dasharray:100;animation:draw .9s cubic-bezier(.4,0,.2,1) both;animation-delay:var(--d,0s)}
@keyframes draw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.branch-svg .pop{transform-box:fill-box;transform-origin:center}
.slide.active .branch-svg .pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:var(--d,0s)}
@keyframes pop{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
.slide.active .tbar-track i{transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.25,1) both;animation-delay:var(--d,0s)}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sw-chip{transform-origin:50% 100%}
.slide.active .sw-chip{animation:chipIn .7s cubic-bezier(.2,.8,.25,1) both;animation-delay:var(--d,0s)}
@keyframes chipIn{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}

/* ---------- v4.2 ---------- */
.huge .pct-sign{font-size:.42em;letter-spacing:0;margin-left:.04em}
.tbar-track i.dim{background:linear-gradient(90deg,#B99FA0,#D8C7C4)}

/* ---------- 1 cover ---------- */
.cover-glow{position:absolute;right:-180px;top:-220px;width:1200px;height:1100px;border-radius:50%;
  background:radial-gradient(circle,rgba(247,217,139,.22),transparent 62%);pointer-events:none}
.cover-left{position:absolute;left:120px;top:132px;width:1060px}
.cover-left h1{font-size:140px}
.cover-rule{width:120px;height:3px;background:linear-gradient(90deg,var(--gold),transparent);margin:44px 0 34px}
.cover-left .lead{font-size:30px}
.cover-team{display:flex;flex-wrap:wrap;gap:12px 34px;margin-top:56px;font-size:23px;color:rgba(255,248,245,.66)}
.cover-team span{position:relative}
.cover-team span+span::before{content:"·";position:absolute;left:-20px;color:var(--gold)}
.cover-meta{display:flex;align-items:center;gap:22px;margin-top:30px;font-size:19px;color:rgba(255,248,245,.5);letter-spacing:.02em}
.pill-gold{background:linear-gradient(135deg,#F7D98B,#D6A84F);color:#3B3032;font-weight:700;font-size:17px;padding:7px 16px;border-radius:999px;letter-spacing:.06em}
.cover-meta .sep{width:5px;height:5px;border-radius:50%;background:rgba(255,248,245,.3)}
.cover-right{position:absolute;right:96px;top:118px;width:680px;height:820px}
.ring{position:absolute;border-radius:50%;border:1px solid rgba(247,217,139,.28)}
.ring-a{width:600px;height:600px;right:30px;top:60px}
.ring-b{width:720px;height:720px;right:-30px;top:0;border-color:rgba(247,217,139,.12)}
.logo-card{position:relative;width:520px;height:520px;margin:120px auto 0;background:linear-gradient(160deg,#FFFDFB,#F7E7E2);
  border-radius:60px;display:grid;place-items:center;padding:52px;
  box-shadow:0 40px 100px rgba(20,4,10,.55),0 0 0 1px rgba(255,248,245,.5) inset}
.logo-card img{width:100%;height:100%;object-fit:contain}
.cover-badge{position:absolute;right:0;bottom:0;background:rgba(255,248,245,.07);border:1px solid rgba(247,217,139,.35);
  border-radius:26px;padding:22px 28px;display:flex;align-items:center;gap:18px;backdrop-filter:blur(6px)}
.cover-badge b{font-family:var(--serif);font-size:64px;line-height:1;color:var(--gold);font-weight:600;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.cover-badge span{font-size:17px;line-height:1.35;color:rgba(255,248,245,.65);letter-spacing:.04em}

/* ---------- 2 roteiro ---------- */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;margin-top:14px}
.step{border-top:1px solid rgba(247,217,139,.4);padding-top:26px}
.step-n{font-family:var(--serif);font-size:40px;color:var(--gold);font-style:italic}
.step h3{font-family:var(--serif);font-size:44px;font-weight:600;margin:14px 0 12px}
.step p{font-size:21px;line-height:1.55;color:rgba(255,248,245,.6);margin:0}
.roteiro-end{margin-top:70px;border-top:1px solid rgba(255,248,245,.12);padding-top:36px}
.re-quote{font-family:var(--serif);font-size:40px;line-height:1.35;color:rgba(255,248,245,.9);max-width:1250px}
.note-line{display:flex;align-items:center;gap:20px;margin-top:26px;font-size:17px;color:rgba(255,248,245,.38)}
.note-line .line{width:80px;height:1px;background:rgba(255,248,245,.2)}

/* ---------- 3 visao ---------- */
.two-col{display:grid;grid-template-columns:1.12fr .88fr;gap:90px;align-items:start}
.two-col .lead{font-size:27px;line-height:1.55}
.ticks{list-style:none;padding:0;margin:46px 0 0;display:grid;gap:26px}
.ticks li{display:flex;gap:18px;align-items:flex-start}
.tick{width:44px;height:44px;border-radius:50%;background:rgba(142,59,82,.1);display:grid;place-items:center;color:var(--rose);flex:none}
.tick .ic{width:22px;height:22px;stroke-width:2}
.ticks b{font-size:23px;display:block;margin-bottom:4px}
.ticks p{margin:0;font-size:19px;line-height:1.5;color:rgba(59,48,50,.62)}
.panel{background:#fff;border:1px solid #EFDCD8;border-radius:30px;padding:40px 44px;box-shadow:0 24px 60px rgba(142,59,82,.09)}
.panel-label{font-size:15px;font-weight:700;letter-spacing:.24em;color:#A0455F;margin-bottom:26px}
.stack-row{display:flex;align-items:center;gap:20px;padding:18px 0;border-bottom:1px solid #F3E4E0}
.stack-row:last-child{border-bottom:0;padding-bottom:0}
.brand-badge{width:56px;height:56px;border-radius:16px;background:#FBF0ED;display:grid;place-items:center;color:var(--rose);flex:none}
.brand-badge .ic{width:30px;height:30px}
.brand-badge.mono{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--rose)}
.stack-row b{display:block;font-size:21px}
.stack-row span{font-size:17px;color:rgba(59,48,50,.55)}

/* ---------- 4 destaques ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:6px;border-top:1px solid rgba(255,248,245,.14)}
.stat{padding:34px 44px 34px 44px;border-right:1px solid rgba(255,248,245,.12)}
.stat:first-child{padding-left:0}
.stat:last-child{border-right:0;padding-right:0}
.stat:last-child{border-right:0}
.stat-n{font-family:var(--serif);font-size:150px;line-height:.9;font-weight:600;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;
  background:linear-gradient(160deg,#FFF4D6,#F7D98B 40%,#D6A84F);-webkit-background-clip:text;background-clip:text;color:transparent}
.stat-t{font-size:24px;font-weight:700;margin-top:12px;letter-spacing:.02em}
.stat p{font-size:18px;line-height:1.5;color:rgba(255,248,245,.52);margin:8px 0 0;max-width:280px}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin-top:52px}
.mini{display:flex;gap:20px;align-items:flex-start;background:rgba(255,248,245,.045);border:1px solid rgba(255,248,245,.1);border-radius:24px;padding:28px 30px}
.mini-ic{color:var(--gold);flex:none;margin-top:2px}
.mini b{font-size:21px;display:block;margin-bottom:6px}
.mini p{margin:0;font-size:17px;line-height:1.5;color:rgba(255,248,245,.55)}

/* ---------- 5 funcionalidades ---------- */
.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:4px}
.card{background:#fff;border:1px solid #EFDCD8;border-radius:26px;padding:34px 34px 30px;box-shadow:0 16px 40px rgba(142,59,82,.06)}
.card-ic{width:58px;height:58px;border-radius:18px;background:linear-gradient(150deg,#F9E7E3,#F3D6D5);display:grid;place-items:center;color:var(--rose);margin-bottom:22px}
.card-ic .ic{width:30px;height:30px}
.card h3{font-family:var(--serif);font-size:36px;font-weight:600;margin:0 0 8px}
.card p{margin:0;font-size:18px;line-height:1.55;color:rgba(59,48,50,.62)}
.foot-note{margin-top:30px;font-size:18px;color:rgba(59,48,50,.5);display:flex;gap:14px;align-items:center}
.foot-note::before{content:"";width:36px;height:1px;background:rgba(142,59,82,.35)}

/* ---------- 6 interface ---------- */
.wf-wrap{display:grid;grid-template-columns:1.3fr .7fr;gap:56px;align-items:start}
.wf{margin:0}
.wf img{width:100%;max-height:640px;object-fit:contain;object-position:left top;border-radius:18px;border:1px solid #EBD8D4;background:#fff;box-shadow:0 24px 60px rgba(142,59,82,.1)}
.wf figcaption{font-size:16px;color:rgba(59,48,50,.5);margin-top:14px}
.wf-side{display:grid;gap:26px;padding-top:6px}
.side-item{display:flex;gap:18px;align-items:flex-start}
.side-item .num{font-family:var(--serif);font-size:30px;font-style:italic;color:var(--rose);line-height:1.2;min-width:42px}
.side-item b{font-size:23px;display:block;margin-bottom:6px}
.side-item p{margin:0;font-size:18px;line-height:1.5;color:rgba(59,48,50,.6)}
.dark .side-item .num{color:var(--gold)}
.dark .side-item b{color:var(--cream)}
.dark .side-item p{color:rgba(255,248,245,.55)}

/* ---------- 7 arquitetura ---------- */
.arch{display:grid;grid-template-columns:1.32fr .68fr;gap:70px;align-items:start;margin-top:2px}
.layers{display:grid;gap:0}
.layer{background:rgba(255,248,245,.05);border:1px solid rgba(255,248,245,.13);border-radius:26px;padding:30px 34px;display:flex;align-items:center;gap:26px}
.layer-tag{font-size:13px;letter-spacing:.2em;font-weight:700;color:var(--gold);writing-mode:vertical-rl;transform:rotate(180deg);align-self:stretch;display:flex;align-items:center;justify-content:center;border-right:1px solid rgba(247,217,139,.25);padding-right:16px}
.layer-body{flex:1}
.layer-body b{font-family:var(--serif);font-size:40px;font-weight:600;display:block;margin-bottom:4px}
.layer-body span{font-size:17px;color:rgba(255,248,245,.55)}
.layer-ic{color:rgba(247,217,139,.6)}
.arch-link{height:54px;display:flex;align-items:center;justify-content:center;gap:12px;color:rgba(247,217,139,.55)}
.arch-link span{width:1px;height:14px;background:rgba(247,217,139,.35)}
.arch-link .ic{width:20px;height:20px;transform:rotate(90deg)}
.arch-side{display:grid;gap:24px;padding-top:6px}
.arch-note{border-left:2px solid rgba(247,217,139,.45);padding-left:24px}
.arch-note b{font-size:21px;display:block;margin-bottom:6px}
.arch-note p{margin:0;font-size:17px;line-height:1.55;color:rgba(255,248,245,.55)}

/* ---------- 8 dados ---------- */
.data-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:56px;align-items:start}
.der-wrap img{width:100%;max-height:620px;object-fit:contain;border-radius:18px;border:1px solid #EBD8D4;background:#fff;padding:14px;box-shadow:0 24px 60px rgba(142,59,82,.1)}
.der-cap{font-size:15px;color:rgba(59,48,50,.5);margin-top:12px;line-height:1.5}
.tables{display:grid;gap:22px}
.tgroup{background:#fff;border:1px solid #EFDCD8;border-radius:22px;padding:24px 28px;box-shadow:0 12px 30px rgba(142,59,82,.05)}
.tgroup-h{font-family:var(--serif);font-size:26px;font-weight:600;display:flex;align-items:center;gap:14px;margin-bottom:10px}
.tag-prefix{font-family:ui-monospace,Consolas,monospace;font-size:14px;background:var(--rose);color:#fff;padding:4px 10px;border-radius:8px;letter-spacing:.04em}
.tag-prefix.bel{background:var(--gold-d);color:#3B3032}
.tlist{font-family:ui-monospace,Consolas,monospace;font-size:16px;line-height:1.9;color:rgba(59,48,50,.66)}
.tgroup.note{background:transparent;border-style:dashed;box-shadow:none}
.tgroup.note .tgroup-h{font-size:22px}
.tgroup.note p{margin:0;font-size:17px;line-height:1.6;color:rgba(59,48,50,.62)}

/* ---------- 9 fluxo ---------- */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;margin-top:4px}
.fstep{position:relative;padding:40px 28px 38px;background:rgba(255,248,245,.045);border:1px solid rgba(255,248,245,.1);border-radius:22px}
.fstep-n{font-family:var(--serif);font-size:36px;font-style:italic;color:var(--gold);display:block;margin-bottom:14px}
.fstep b{font-size:20px;display:block;margin-bottom:8px;line-height:1.3}
.fstep p{margin:0;font-size:16px;line-height:1.5;color:rgba(255,248,245,.55)}
.flow-bottom{display:grid;grid-template-columns:1fr .9fr;gap:60px;align-items:end;margin-top:76px}
.statuses{display:flex;gap:12px;flex-wrap:wrap}
.status{display:inline-flex;align-items:center;gap:9px;font-size:17px;padding:12px 18px;border-radius:999px;background:rgba(255,248,245,.05);border:1px solid rgba(255,248,245,.12)}
.status i{width:9px;height:9px;border-radius:50%;display:inline-block}
.flow-quote{font-family:var(--serif);font-size:32px;font-style:italic;line-height:1.4;color:rgba(255,248,245,.9)}
.flow-quote span{display:block;font-family:var(--sans);font-style:normal;font-size:15px;letter-spacing:.08em;color:rgba(255,248,245,.4);margin-top:12px}

/* ---------- 10 codigo ---------- */
.code-layout{display:grid;grid-template-columns:1.1fr .9fr;gap:58px;align-items:start}
.code-win{background:#17060D;border:1px solid rgba(247,217,139,.25);border-radius:24px;overflow:hidden;box-shadow:0 30px 70px rgba(10,2,6,.5)}
.code-top{display:flex;align-items:center;gap:16px;padding:16px 22px;background:rgba(255,248,245,.05);border-bottom:1px solid rgba(255,248,245,.08)}
.dots{display:flex;gap:7px}
.dots i{width:11px;height:11px;border-radius:50%;background:#8E3B52;display:block}
.dots i:nth-child(2){background:#D6A84F}
.dots i:nth-child(3){background:#72A68A}
.file{font-family:ui-monospace,Consolas,monospace;font-size:15px;color:rgba(255,248,245,.55)}
.file-tag{margin-left:auto;font-size:12px;letter-spacing:.16em;color:var(--gold);border:1px solid rgba(247,217,139,.3);padding:3px 9px;border-radius:6px}
.code code{background:none;padding:0;color:inherit;font-size:inherit;border-radius:0}
.code{margin:0;padding:32px 34px;font-family:ui-monospace,"Cascadia Mono",Consolas,monospace;font-size:24px;line-height:1.8;color:#EFE2DE;overflow:auto}
.code .kw{color:#F7D98B}.code .fn{color:#E3A2B0}.code .op{color:#C77C8A}
.code-fail{border-top:1px solid rgba(255,248,245,.08);padding:16px 24px;font-size:15px;color:rgba(255,248,245,.5);display:flex;gap:12px;align-items:center}
.code-fail .x{width:20px;height:20px;border-radius:50%;background:rgba(201,92,98,.2);color:#E78E93;display:grid;place-items:center;font-size:13px}
.code-side{display:grid;gap:26px}
.clean-badge{display:flex;align-items:center;gap:18px;background:rgba(114,166,138,.12);border:1px solid rgba(114,166,138,.35);border-radius:18px;padding:18px 24px;color:#9CC9B4}
.clean-badge b{display:block;font-size:19px;color:#D8EDE2}
.clean-badge span{font-size:16px;color:rgba(216,237,226,.6)}

/* ---------- 11 testes ---------- */
.tests{display:grid;grid-template-columns:1.08fr .92fr;gap:64px;align-items:start}
.big-row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;border-bottom:1px solid #EBD8D4;padding-bottom:30px}
.huge{font-family:var(--serif);font-size:96px;line-height:.9;color:var(--rose);font-weight:600;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.huge span{font-size:44px;color:rgba(142,59,82,.6)}
.huge-l{font-size:16px;color:rgba(59,48,50,.55);margin-top:6px;line-height:1.4}
.light-panel{background:#fff;border:1px solid #EFDCD8;border-radius:24px;padding:30px 32px;margin-top:34px;box-shadow:0 16px 40px rgba(142,59,82,.06)}
.light-panel p{margin:0;font-size:18px;line-height:1.6;color:rgba(59,48,50,.65)}
.pattern{display:grid;gap:6px;margin-top:24px;padding-top:20px;border-top:1px solid #F3E4E0}
.pattern>span:first-child{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:rgba(59,48,50,.4)}
.pattern .pat{background:rgba(142,59,82,.08);color:#8E3B52;padding:8px 12px;border-radius:8px;font-size:15px}
.pattern .ex{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:rgba(59,48,50,.5)}
.test-stamp{display:flex;align-items:center;gap:12px;margin-top:22px;font-size:15px;color:rgba(59,48,50,.5)}
.test-stamp svg{width:24px;height:24px;color:#8E3B52}
.test-bars{display:grid;gap:22px;margin-top:16px}
.tbar-top{display:flex;justify-content:space-between;font-size:17px;margin-bottom:8px;color:rgba(59,48,50,.7)}
.tbar-top b{color:var(--rose);font-size:18px}
.tbar-track{height:8px;border-radius:999px;background:rgba(142,59,82,.1);overflow:hidden}
.tbar-track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#8E3B52,#C77C8A)}
.test-note{margin-top:34px;font-size:16px;line-height:1.6;color:rgba(59,48,50,.5);border-left:2px solid rgba(142,59,82,.3);padding-left:18px}

/* ---------- 12 pipelines ---------- */
.pipelines{display:grid;gap:30px}
.pipe-row{background:rgba(255,248,245,.04);border:1px solid rgba(255,248,245,.1);border-radius:26px;padding:40px 36px;display:flex;align-items:center;gap:30px}
.pipe-label{display:flex;align-items:center;gap:16px;min-width:330px}
.badge-blue,.badge-gold{font-size:14px;font-weight:700;letter-spacing:.12em;padding:8px 12px;border-radius:9px;flex:none}
.badge-blue{background:rgba(114,166,138,.18);color:#A9D4BE;border:1px solid rgba(114,166,138,.4)}
.badge-gold{background:rgba(247,217,139,.16);color:var(--gold);border:1px solid rgba(247,217,139,.4)}
.pipe-label b{display:block;font-size:19px}
.pipe-label span{font-size:15px;color:rgba(255,248,245,.45)}
.pipe{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pipe-step{display:flex;align-items:center;gap:10px;font-size:18px;padding:14px 19px;border-radius:12px;background:rgba(255,248,245,.06);border:1px solid rgba(255,248,245,.12)}
.pipe-step .ic{width:17px;height:17px;color:#9CC9B4}
.pipe-step.gold{border-color:rgba(247,217,139,.28)}
.pipe-step.gold .ic{color:var(--gold)}
.pipe-arrow{color:rgba(247,217,139,.45);font-size:20px}
.pipe-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding:0 6px}
.runner{display:flex;align-items:center;gap:14px;font-size:17px;color:rgba(255,248,245,.5)}
.runner .ic{width:22px;height:22px;color:rgba(255,248,245,.7)}
.runner b{color:rgba(255,248,245,.85)}
.runner-stat{display:flex;align-items:center;gap:14px}
.runner-stat b{font-family:var(--serif);font-size:44px;color:var(--gold);font-weight:600;line-height:1;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.runner-stat span{font-size:14px;color:rgba(255,248,245,.45);line-height:1.4}

/* ---------- 13 gitflow ---------- */
.git-layout{display:grid;grid-template-columns:1.05fr .95fr;gap:60px;align-items:start}
.branch-svg{width:100%;height:auto;margin-top:20px}
.svgl{fill:rgba(255,248,245,.5);font-family:var(--sans);font-size:16px;letter-spacing:.08em}
.gold-l{fill:var(--gold)}
.git-cap{font-size:17px;line-height:1.6;color:rgba(255,248,245,.5);margin:10px 0 0;max-width:560px}
.ver-card{background:linear-gradient(150deg,rgba(247,217,139,.14),rgba(247,217,139,.03));border:1px solid rgba(247,217,139,.3);border-radius:26px;padding:30px 34px}
.ver-top{font-size:13px;letter-spacing:.22em;color:var(--gold)}
.ver-num{font-family:var(--serif);font-size:96px;line-height:1;margin:8px 0 6px;font-weight:600;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.ver-sub{font-size:16px;color:rgba(255,248,245,.55)}
.ver-dates{display:flex;gap:16px;margin-top:22px}
.ver-dates span{flex:1;background:rgba(20,4,10,.25);border-radius:12px;padding:12px 16px;font-size:15px;color:rgba(255,248,245,.5)}
.ver-dates b{display:block;font-size:18px;color:var(--cream);margin-bottom:2px}
.commits-box{margin-top:26px;padding:0 4px}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-family:ui-monospace,Consolas,monospace;font-size:15px;padding:8px 14px;border-radius:8px;background:rgba(255,248,245,.07);border:1px solid rgba(255,248,245,.12);color:var(--gold)}
.commits-note{margin:0;font-size:16px;color:rgba(255,248,245,.5)}

/* ---------- 14 numeros ---------- */
.num-layout{display:grid;grid-template-columns:1.42fr .58fr;gap:56px;align-items:start}
.chart{width:100%;height:auto}
.chart .cv{fill:rgba(255,248,245,.8);font-family:var(--sans);font-size:16px;font-weight:700}
.chart .cl{fill:rgba(255,248,245,.35);font-family:var(--sans);font-size:14px}
.chart-cap{display:flex;align-items:center;gap:24px;margin-top:8px;font-size:15px;color:rgba(255,248,245,.45)}
.chart-cap .right{margin-left:auto}
.legend{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px;background:#C77C8A;display:block}
.legend.gold i{background:var(--gold)}
.metrics{display:grid;gap:22px}
.metric{border-bottom:1px solid rgba(255,248,245,.1);padding-bottom:18px}
.metric:last-child{border-bottom:0}
.m-n{font-family:var(--serif);font-size:64px;line-height:1;color:var(--gold);font-weight:600;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1}
.m-l{font-size:18px;margin-top:4px}
.m-l span{display:block;font-size:14px;color:rgba(255,248,245,.42);margin-top:2px}

/* ---------- 15 paleta ---------- */
.palette{display:grid;grid-template-columns:repeat(8,1fr);gap:18px;margin-top:6px}
.sw-chip{height:150px;border-radius:18px;border:1px solid rgba(59,48,50,.08);box-shadow:0 12px 26px rgba(59,48,50,.08)}
.sw-name{font-size:15px;font-weight:700;margin-top:14px}
.sw-hex{font-family:ui-monospace,Consolas,monospace;font-size:14px;color:rgba(59,48,50,.6);margin-top:3px}
.sw-use{font-size:13px;line-height:1.45;color:rgba(59,48,50,.45);margin-top:6px}
.pal-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:64px;gap:40px}
.pal-note{font-size:16px;line-height:1.6;color:rgba(59,48,50,.5);max-width:560px;border-left:2px solid rgba(142,59,82,.3);padding-left:18px}
.type-demo{display:flex;align-items:center;gap:16px}
.td-serif{font-family:var(--serif);font-size:60px;color:var(--rose);line-height:1}
.td-sans{font-family:var(--sans);font-size:38px;font-weight:700;color:rgba(59,48,50,.8);margin-left:18px}
.type-demo b{display:block;font-size:14px}
.type-demo div span{font-size:13px;color:rgba(59,48,50,.45)}

/* ---------- 16 desafios ---------- */
.challenges{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:4px}
.challenge{display:flex;gap:22px;align-items:flex-start;background:rgba(255,248,245,.045);border:1px solid rgba(255,248,245,.1);border-radius:24px;padding:30px 32px}
.ch-ic{width:52px;height:52px;border-radius:15px;background:rgba(247,217,139,.12);color:var(--gold);display:grid;place-items:center;flex:none}
.ch-ic .ic{width:26px;height:26px}
.challenge b{font-family:var(--serif);font-size:30px;font-weight:600;display:block;margin-bottom:6px}
.challenge p{margin:0;font-size:17px;line-height:1.55;color:rgba(255,248,245,.55)}
.lesson{display:flex;align-items:flex-start;gap:20px;margin-top:38px;padding:26px 32px;border-radius:20px;background:rgba(247,217,139,.08);border:1px solid rgba(247,217,139,.22)}
.lesson .ic{color:var(--gold);width:28px;height:28px;flex:none;margin-top:2px}
.lesson p{margin:0;font-size:21px;line-height:1.55;color:rgba(255,248,245,.75)}
.lesson b{color:var(--cream)}

/* ---------- 17 proximos ---------- */
.nexts{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;margin-top:6px}
.next{background:#fff;border:1px solid #EFDCD8;border-radius:24px;padding:28px 26px;box-shadow:0 14px 34px rgba(142,59,82,.06)}
.next-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;color:var(--rose)}
.next-state{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(59,48,50,.4);border:1px solid #EBD8D4;border-radius:999px;padding:5px 10px}
.next b{font-family:var(--serif);font-size:28px;font-weight:600;display:block;margin-bottom:8px;line-height:1.2}
.next p{margin:0;font-size:16px;line-height:1.55;color:rgba(59,48,50,.58)}
.repo-strip{display:flex;gap:40px;margin-top:44px;padding-top:26px;border-top:1px solid #EBD8D4;font-size:16px;color:rgba(59,48,50,.55)}
.repo-strip div{display:flex;align-items:center;gap:10px}
.repo-strip .ic{width:18px;height:18px;color:var(--rose)}
.repo-strip b{color:var(--ink)}

/* ---------- 18 obrigado ---------- */
.thanks-glow{position:absolute;left:-200px;bottom:-320px;width:1200px;height:1100px;border-radius:50%;
  background:radial-gradient(circle,rgba(247,217,139,.16),transparent 62%)}
.thanks-left{position:absolute;left:120px;top:250px;width:1000px}
.thanks-left .display{font-size:160px;margin:26px 0 0}
.thanks-left .lead{font-size:34px;margin-top:26px}
.demo-chips{display:flex;gap:12px;margin-top:36px}
.demo-chips span{font-size:17px;padding:10px 18px;border-radius:999px;border:1px solid rgba(247,217,139,.35);color:var(--gold)}
.thanks-meta{display:flex;align-items:center;gap:12px;margin-top:44px;font-size:19px;color:rgba(255,248,245,.55)}
.thanks-meta .ic{width:22px;height:22px}
.qr-card{position:absolute;right:120px;top:270px;background:var(--cream);border-radius:30px;padding:34px;display:flex;flex-direction:column;align-items:center;gap:22px;box-shadow:0 30px 80px rgba(10,2,6,.5)}
.qr{width:300px;height:300px;fill:#3B3032}
.qr-cap{font-size:17px;color:var(--ink);text-align:center;line-height:1.5}
.qr-cap span{font-size:14px;color:rgba(59,48,50,.5)}
.thanks-logo{position:absolute;right:150px;top:120px;width:120px;height:120px;opacity:.9}
.thanks-logo img{width:100%;height:100%;object-fit:contain}

/* ---------- UI ---------- */
.progress{position:fixed;left:0;bottom:0;height:3px;background:linear-gradient(90deg,#8E3B52,#F7D98B);z-index:50;transition:width .3s ease;box-shadow:0 0 18px rgba(247,217,139,.5)}
.notes-panel{position:fixed;left:0;right:0;bottom:0;background:rgba(12,4,8,.94);backdrop-filter:blur(14px);border-top:1px solid rgba(247,217,139,.25);
  color:#EFE2DE;padding:26px 48px 30px;font-size:17px;line-height:1.6;z-index:40;transform:translateY(110%);transition:transform .35s ease;max-height:38vh;overflow:auto}
body.notes-on .notes-panel{transform:none}
.notes-panel b{display:block;font-size:12px;letter-spacing:.2em;color:#F7D98B;margin-bottom:8px}
.hint{animation:fadeHint 1s ease 8s both;position:fixed;right:22px;bottom:18px;font-size:12px;letter-spacing:.12em;color:rgba(255,248,245,.25);z-index:45}

@media print{
  @page{size:1920px 1080px;margin:0}
  html,body{overflow:visible;height:auto;background:#fff}
  #stage{position:static;display:block}
  #deck{transform:none!important;width:1920px;height:auto}
  .slide{position:relative;inset:auto;display:block!important;opacity:1!important;visibility:visible!important;transform:none!important;
    page-break-after:always;break-after:page;width:1920px;height:1080px}
  .slide.active .anim{animation:none}
  .chart .bar{animation:none!important;transform:none!important}
  .chart .cv{animation:none!important;opacity:1!important}
  .branch-svg .draw{stroke-dasharray:none!important;stroke-dashoffset:0!important}
  .branch-svg .pop{animation:none!important;opacity:1!important}
  .tbar-track i,.sw-chip{animation:none!important;transform:none!important}
  .progress,.notes-panel,.hint{display:none!important}
}

@keyframes fadeHint{to{opacity:0;visibility:hidden}}

.pipe-minis{margin-top:34px}
.pipe-minis .mini{padding:22px 24px}
.pipe-minis .mini b{font-size:19px}
.pipe-minis .mini p{font-size:15px}

.accent-num{color:var(--rose)}
.guarantees{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:56px;border-top:1px solid rgba(255,248,245,.12);padding-top:30px}
.gt-k{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.gt p{margin:8px 0 0;font-size:16px;line-height:1.55;color:rgba(255,248,245,.55)}
.sw-chip{height:210px}

.lightbox{position:fixed;inset:0;background:rgba(9,2,5,.95);display:none;place-items:center;z-index:60;padding:36px;cursor:zoom-out}
.lightbox.on{display:grid}
.lightbox img{max-width:96vw;max-height:92vh;border-radius:14px;box-shadow:0 30px 80px rgba(0,0,0,.6);background:#fff}


.branches{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,248,245,.12)}
.br-label{font-family:var(--sans);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,248,245,.42);margin-bottom:8px}
.br-row{display:flex;align-items:center;flex-wrap:wrap;gap:7px;font-size:13px;color:rgba(255,248,245,.66);padding:7px 11px;border-radius:10px;background:rgba(255,248,245,.04);border:1px solid rgba(255,248,245,.08)}
.br-row+.br-row{margin-top:6px;background:rgba(247,217,139,.06);border-color:rgba(247,217,139,.18)}
.br-row b{font-size:14px}
.br-row code{font-family:var(--mono);font-size:11.5px;color:rgba(255,248,245,.45)}
.br-sep{color:rgba(255,248,245,.25)}
.br-dot{width:7px;height:7px;border-radius:50%;background:var(--rose-l)}
.br-dot.dev{background:var(--gold)}
.br-tag{margin-left:auto;font-size:11px;letter-spacing:.08em;color:rgba(255,248,245,.6);border:1px solid rgba(255,248,245,.2);border-radius:999px;padding:2px 8px}
.br-cap{margin:9px 0 0;font-size:13px;line-height:1.45;color:rgba(255,248,245,.5)}

.tw-ch{display:inline;opacity:0;animation:twIn .3s ease forwards}
@keyframes twIn{from{opacity:0}to{opacity:1}}
body.tw-final .tw-ch{opacity:1!important;animation:none!important}
@media print{.tw-ch{opacity:1!important;animation:none!important}}

/* ---------- v5 · marca d'água ---------- */
.slide::after{content:"";position:absolute;right:-70px;bottom:-110px;width:820px;height:820px;background:var(--wm) center/contain no-repeat;pointer-events:none;z-index:0;opacity:.085;filter:brightness(2.1) saturate(1.1)}
.slide.light::after{opacity:.075;filter:none}
.slide.cover::after,.slide.thanks::after{display:none}

/* ---------- v5 · código digitado ---------- */
.code{--px:34px}
.sim-code .code{--px:28px;padding:24px var(--px);font-size:18.5px;line-height:1.62}
.code .ln{display:block;margin:0 calc(var(--px)*-1);padding:0 var(--px) 0 calc(var(--px) - 3px);border-left:3px solid transparent;transition:background .3s,border-color .3s;white-space:pre}
.code .ln.j-cur{background:rgba(247,217,139,.07);border-left-color:#F7D98B}
.code .ln.j-err{background:rgba(201,92,98,.2);border-left-color:#E78E93}
.code .str{color:#9CC9B4}.code .ty{color:#F3C7CF}.code .num{color:#D6A84F}.code .cm{color:rgba(255,248,245,.38);font-style:italic}
.c-h{visibility:hidden}
.caret{position:relative;display:inline-block;width:0;height:1em}
.caret::after{content:"";position:absolute;left:1px;top:-.1em;width:2px;height:1.2em;background:#F7D98B;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sim-run .code-fail{opacity:0;transition:opacity .6s}
.sim-run.done .code-fail{opacity:1}
.code-win.sim-code{width:800px}
.code-win+.code-win{margin-top:16px}

/* ---------- v5 · simulação do app ---------- */
.sim-layout{display:grid;grid-template-columns:800px 840px;gap:40px;align-items:start}
.sim-col{display:grid;gap:16px;align-content:start}
.app-win{position:relative;background:#FFF8F5;border-radius:16px;overflow:hidden;color:#3B3032;box-shadow:0 30px 70px rgba(10,2,6,.5),0 0 0 1px rgba(247,217,139,.25);font-size:15px;font-family:var(--sans)}
.app-bar{height:38px;background:#F5E8E5;display:flex;align-items:center;gap:10px;padding:0 0 0 14px;font-size:14px;color:#5C4B4E;border-bottom:1px solid #E9D4D0}
.app-dot{width:14px;height:14px;border-radius:4px;background:linear-gradient(135deg,#8E3B52,#C77C8A)}
.sim-tag{font-size:10.5px;letter-spacing:.16em;font-weight:700;color:#A0455F;border:1px solid rgba(160,69,95,.4);border-radius:999px;padding:2px 9px;margin-left:8px}
.win-btns{margin-left:auto;display:flex}
.win-btns i{width:46px;height:38px;display:grid;place-items:center;font-style:normal;font-size:14px;color:#5C4B4E}
.app-body{display:grid;grid-template-columns:168px 1fr}
.app-side{background:#FFF8F5;border-right:1px solid #EBD6D4;padding:16px 14px;display:flex;flex-direction:column;gap:10px}
.app-logo{width:92px;height:92px;margin:0 auto;background:var(--logo-sm) center/contain no-repeat}
.app-sub{font-size:11.5px;text-align:center;color:#75696B;margin:-4px 0 8px}
.side-btn{background:#8E3B52;color:#fff;border-radius:8px;padding:10px 0;text-align:center;font-weight:700;font-size:14px;transition:transform .2s,background .2s,box-shadow .2s}
.side-btn.j-press{transform:scale(.94);background:#C77C8A;box-shadow:0 0 0 4px rgba(247,217,139,.55)}
.app-main{padding:16px 20px 18px;display:flex;flex-direction:column;gap:14px;position:relative;background:#FFF8F5;min-width:0}
.ag-head{display:flex;align-items:center;justify-content:space-between}
.ag-head b{font-family:var(--serif);font-size:30px;color:#8E3B52;font-weight:600;line-height:1}
.dtp{border:1px solid #D9BFC0;border-radius:6px;padding:5px 12px;background:#fff;font-size:14px}
.grp{border:1px solid #E6CFCF;border-radius:10px;padding:14px 14px 12px;position:relative;background:#fff;margin-top:4px}
.grp.lst{min-height:170px}
.grp-t{position:absolute;top:-10px;left:12px;background:#FFF8F5;padding:0 8px;font-size:13px;font-weight:700;color:#8E3B52}
.btns{position:absolute;right:12px;top:-15px;display:flex;gap:8px}
.btn{background:#8E3B52;color:#fff;border-radius:7px;padding:6px 14px;font-weight:700;font-size:13px;transition:transform .2s,box-shadow .2s,background .2s}
.btn.sec{background:#fff;color:#8E3B52;border:1px solid #8E3B52;padding:5px 13px}
.btn.j-press{transform:scale(.93);box-shadow:0 0 0 4px rgba(247,217,139,.6)}
table.grid{width:100%;border-collapse:collapse;font-size:14px;margin-top:2px}
table.grid th{background:#8E3B52;color:#fff;text-align:left;padding:7px 10px;font-weight:700;font-size:13px}
table.grid td{padding:7px 10px;border-bottom:1px solid #F0E0DD;white-space:nowrap}
table.grid tr.nw td{background:rgba(247,217,139,.3)}
table.grid tr.j-sel td{background:#F3D6D5}
.sit{display:inline-flex;align-items:center;gap:7px}.sit i{width:9px;height:9px;border-radius:50%;display:block}
.fm{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 12px;margin-top:2px}
.fld label{display:block;font-size:11.5px;color:#75696B;margin-bottom:3px}
.fld div{background:#fff;border:1px solid #D9BFC0;border-radius:6px;padding:6px 10px;font-size:14px;min-height:31px;white-space:nowrap;overflow:hidden}
.valid{position:absolute;left:150px;top:-13px;font-size:12px;font-weight:700;color:#3C7A5A;background:#E4F2EA;border:1px solid #A9D4BE;border-radius:999px;padding:3px 10px;transition:opacity .4s,transform .4s}
.msgbox{position:absolute;left:50%;top:50%;width:440px;transform:translate(-50%,-46%) scale(.96);background:#fff;border:1px solid #8a8a8a;box-shadow:0 24px 60px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5;font-size:14px;color:#222}
.msgbox.j-show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.mb-bar{display:flex;justify-content:space-between;padding:8px 12px;font-size:13px}
.mb-body{display:flex;gap:16px;align-items:center;padding:18px 22px 22px;font-size:15px;line-height:1.45}
.mb-body p{min-width:0;overflow-wrap:anywhere}
.mb-ic{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px;background:#2B7CD3}
.mb-ic.err{background:#D13438}
.mb-foot{background:#F0F0F0;padding:12px 16px;display:flex;justify-content:flex-end;gap:8px}
.mb-foot u{text-decoration:none;border:1px solid #adadad;background:#e1e1e1;padding:5px 24px;font-size:13px;transition:transform .2s,box-shadow .2s,border-color .2s}
.mb-foot u.j-press{border-color:#0078d7;box-shadow:0 0 0 3px rgba(0,120,215,.35);transform:scale(.95)}
.app-dim{position:absolute;inset:0;background:rgba(20,6,12,.28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:4}
.app-dim.j-show{opacity:1}
.sfd{position:absolute;left:50%;top:50%;width:600px;transform:translate(-50%,-46%) scale(.96);background:#fff;border:1px solid #8a8a8a;box-shadow:0 24px 60px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5;font-size:14px;color:#222}
.sfd.j-show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.sfd-b{padding:14px 18px;display:grid;gap:10px}
.sfd-row{display:grid;grid-template-columns:90px 1fr;align-items:center;gap:10px}
.sfd-row span{text-align:right;font-size:13px;color:#444}
.sfd-row div{border:1px solid #7a7a7a;padding:6px 8px;background:#fff;white-space:nowrap;overflow:hidden;font-size:13.5px}
.sfd-list{height:74px;border:1px solid #cfcfcf;display:grid;place-items:center;color:#8a8a8a;font-size:13px}

/* tx / banco */
.tx{background:rgba(255,248,245,.05);border:1px solid rgba(255,248,245,.12);border-radius:16px;padding:14px 18px 16px}
.tx-h{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.18em;color:var(--gold);font-weight:700}
.tx-state{font-weight:700;letter-spacing:.1em;padding:4px 12px;border-radius:6px;background:rgba(114,166,138,.2);color:#9CC9B4;transition:all .3s}
.tx-state.begin{background:rgba(247,217,139,.16);color:#F7D98B}
.tx-state.rbk{background:rgba(201,92,98,.22);color:#F0A0A5}
.tx-state.idle{background:rgba(255,248,245,.08);color:rgba(255,248,245,.5)}
.tx-row{display:flex;align-items:center;gap:8px;margin-top:12px}
.tx-chip{flex:1;min-width:0;border-radius:12px;padding:10px 12px;border:1px solid rgba(114,166,138,.85);background:rgba(114,166,138,.24);transition:all .4s}
.tx-chip b{display:block;font-family:ui-monospace,Consolas,monospace;font-size:13.5px;color:#D8EDE2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .3s}
.tx-chip span{font-size:12.5px;color:rgba(216,237,226,.72)}
.tx-ar{flex:none;color:rgba(247,217,139,.8);font-size:12px;transition:opacity .4s}
.tx-note{margin-top:12px;font-size:14px;color:rgba(255,248,245,.6);display:flex;gap:10px;align-items:center;min-height:22px}
.whatif{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.06em;color:#F0A0A5;border:1px solid rgba(240,160,165,.5);border-radius:999px;padding:3px 12px;transition:opacity .4s}
.rb .tx-chip{border-color:rgba(255,248,245,.25);background:transparent;border-style:dashed}
.rb .tx-chip b{color:rgba(255,248,245,.45);text-decoration:line-through}
.rb .tx-chip span{color:rgba(255,248,245,.45)}
.rb .tx-chip.j-fail{border-style:solid;border-color:rgba(231,142,147,.8);background:rgba(201,92,98,.2)}
.rb .tx-chip.j-fail b{color:#F7C3C6;text-decoration:none}
.rb .tx-chip.j-fail span{color:#F0A0A5}
table.dbt{width:100%;border-collapse:collapse;font-family:ui-monospace,Consolas,monospace;font-size:14px;margin-top:12px}
table.dbt th{text-align:left;font-size:12px;letter-spacing:.1em;color:rgba(255,248,245,.45);padding:4px 10px;font-weight:700}
table.dbt td{padding:7px 10px;border-top:1px solid rgba(255,248,245,.08);color:rgba(255,248,245,.8)}
table.dbt tr.tg td{background:rgba(247,217,139,.1)}
table.dbt .eb{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:1px 8px;background:rgba(255,248,245,.08)}
table.dbt .eb.e{background:rgba(201,92,98,.25);color:#F0A0A5;font-weight:700}
.pend{font-size:12px;color:#F7D98B;margin-left:10px}
/* runner de testes */
.rr-list{padding:6px 0}
.rr{display:flex;align-items:center;gap:12px;padding:7px 20px;font-family:ui-monospace,Consolas,monospace;font-size:14px;color:#3B3032;border-left:3px solid transparent;transition:background .25s,border-color .25s}
.rr .ic2{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:#72A68A;color:#fff}
.rr.j-idle .ic2{background:#D9C9C6;color:transparent}
.rr.j-run .ic2{background:transparent;border:2px solid #D6A84F;border-top-color:transparent;animation:spin .7s linear infinite;color:transparent}
.rr.j-disc{background:rgba(247,217,139,.25);border-left-color:#D6A84F}
@keyframes spin{to{transform:rotate(360deg)}}
.rr-head{display:flex;align-items:center;gap:12px;padding:14px 20px 8px}
.rr-head b{font-size:15px}
.rr-head .btn{margin-left:auto}
.sum{display:flex;align-items:center;gap:18px;padding:12px 20px 16px;border-top:1px solid #EBD6D4;background:#FBF1EE}
.sum-n{font-family:var(--serif);font-size:54px;line-height:1;color:#3C7A5A;font-weight:600;font-variant-numeric:lining-nums;font-feature-settings:'lnum' 1;min-width:96px}
.sum-t{font-size:15px;line-height:1.35;color:#5C4B4E}
.sum-bar{flex:1;height:10px;border-radius:999px;background:#E6D4D1;overflow:hidden}
.sum-bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#72A68A,#9CC9B4);transform-origin:left;transition:transform .5s}
.mini-note{font-size:15px;color:rgba(255,248,245,.55);margin-top:2px}
@keyframes rowOut{0%{opacity:1}70%{opacity:0}100%{opacity:0;display:none}}
.j-gone{animation:rowOut .6s forwards}
/* v6 · cena do estilingue */
.scene{position:absolute;inset:0;z-index:6;display:none;cursor:pointer}
.slide.sc-run .scene{display:block}
.slide.sc-out .scene{opacity:0;transition:opacity .45s ease;pointer-events:none}
.scene-svg{position:absolute;left:0;top:0;width:1920px;height:1080px}
.slide.sc-hold .content,.slide.sc-hold .title{visibility:hidden}
.slide.sc-hold .anim,.slide.sc-hold .tbar-track i{animation:none!important;opacity:0!important}
.slide.sc-out .content{animation:scFade .6s ease both}
@keyframes scFade{from{opacity:0}to{opacity:1}}
.sc-wood{fill:none;stroke:#6B2B3E;stroke-linecap:round}
.sc-wood.w22{stroke-width:22} .sc-wood.w16{stroke-width:16}
.sc-band{stroke:#8E3B52;stroke-width:9;stroke-linecap:round}
.sc-blk{fill:#FFF8F5;stroke:#C9A7A9;stroke-width:2.5}
.sc-blk.bug{fill:#F8DAD7;stroke:#C95C62}
.sc-t{font:600 14px ui-monospace,Consolas,monospace;fill:#5C4B4E;text-anchor:middle}
.sc-blk.bug + .sc-t{fill:#8E2F36}
.sc-lab{font:700 15px 'DM Sans',system-ui,sans-serif;letter-spacing:.16em;text-transform:uppercase;fill:#8E3B52;text-anchor:middle}
.sc-skip{font:500 14px 'DM Sans',system-ui,sans-serif;fill:#A89296;text-anchor:end;opacity:.8}
